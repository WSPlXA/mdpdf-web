[package]
name = "mdpdf-wasm"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
comrak = { version = "0.39", default-features = false }
html-escape = "0.2"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.4.0"
wasm-bindgen = "=0.2.127"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
