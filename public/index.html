<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown PDF Desktop</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="workspace-pane">
      <header class="pane-header brand-header">
        <div>
          <strong>Markdown PDF</strong>
          <small>Windows / オフライン</small>
        </div>
        <button id="openFolderBtn" class="primary" type="button">フォルダを開く</button>
      </header>
      <div class="workspace-meta">
        <span id="workspacePath">フォルダ未選択</span>
        <button id="refreshBtn" class="icon-button" type="button" title="更新">↻</button>
      </div>
      <label class="filter-field">
        <input id="fileFilter" type="search" placeholder="ファイルを絞り込み">
      </label>
      <div class="selection-bar">
        <label><input id="selectAllFiles" type="checkbox"> 表示中を選択</label>
        <span id="selectionCount">0 / 0</span>
      </div>
      <div id="fileList" class="file-list" role="listbox" aria-label="Markdown ファイル">
        <div class="empty-state"></div>
      </div>
    </aside>

    <section class="document-pane">
      <header class="pane-header document-header">
        <div class="document-title">
          <strong id="activeFilename">文書未選択</strong>
          <small id="activeRelativePath">左の一覧から Markdown を選択</small>
        </div>
        <div class="header-actions">
          <button id="settingsToggle" type="button">出力設定</button>
          <span id="dirtyState" class="state-pill">待機中</span>
          <button id="reloadBtn" type="button" disabled>再読込</button>
          <button id="saveBtn" class="primary" type="button" disabled>保存</button>
        </div>
      </header>
      <div id="settingsPanel" class="settings-panel" hidden>
        <section class="setting-group">
          <strong>レイアウト</strong>
          <label>テンプレート
            <select id="themeSelect">
              <option value="custom">カスタム</option>
              <option value="modern-tech">Modern Tech</option>
              <option value="jp-standard">日本語標準</option>
            </select>
          </label>
          <label>フォント
            <select id="fontFamilySelect">
              <option value="sans">サンセリフ</option>
              <option value="serif">セリフ</option>
              <option value="jp">日本語フォント</option>
              <option value="mono">等幅フォント</option>
            </select>
          </label>
          <div class="setting-row compact-fields">
            <label>文字サイズ<input id="fontSizeInput" type="number" min="8" max="24" step="0.5" value="10.5"></label>
            <label>行間<input id="lineHeightInput" type="number" min="1" max="2.5" step="0.05" value="1.7"></label>
          </div>
          <div class="setting-row color-fields">
            <label>文字<input id="textColorInput" type="color" value="#242424"></label>
            <label>アクセント<input id="accentColorInput" type="color" value="#2f6f73"></label>
          </div>
        </section>

        <section class="setting-group">
          <strong>ページ</strong>
          <label>用紙
            <select id="pageSizeSelect">
              <option value="A4">A4</option>
              <option value="A3">A3</option>
              <option value="Letter">Letter</option>
            </select>
          </label>
          <div class="setting-row margin-fields">
            <label>上<input id="marginTopInput" type="number" min="0" max="60" step="1" value="20"></label>
            <label>右<input id="marginRightInput" type="number" min="0" max="60" step="1" value="18"></label>
            <label>下<input id="marginBottomInput" type="number" min="0" max="60" step="1" value="18"></label>
            <label>左<input id="marginLeftInput" type="number" min="0" max="60" step="1" value="18"></label>
          </div>
          <div class="check-grid">
            <label><input id="mermaidToggle" type="checkbox"> Mermaid</label>
            <label><input id="coverToggle" type="checkbox"> 表紙</label>
            <label><input id="tocToggle" type="checkbox"> 目次</label>
            <label><input id="chapterBreakToggle" type="checkbox"> 章ごとに改ページ</label>
          </div>
        </section>

        <section class="setting-group header-footer-settings">
          <strong>ヘッダーとフッター</strong>
          <div class="header-footer-row">
            <label class="enable-field"><input id="headerEnabledToggle" type="checkbox"> ヘッダー</label>
            <input id="headerTextInput" type="text" placeholder="例：プロジェクト名" value="">
            <select id="headerAlignSelect" aria-label="ヘッダーの配置">
              <option value="left">左</option><option value="center">中央</option><option value="right">右</option>
            </select>
          </div>
          <div class="header-footer-row">
            <label class="enable-field"><input id="footerEnabledToggle" type="checkbox" checked> フッター</label>
            <input id="footerTextInput" type="text" value="{page} / {total}" placeholder="{page} と {total} に対応">
            <select id="footerAlignSelect" aria-label="フッターの配置">
              <option value="left">左</option><option value="center">中央</option><option value="right" selected>右</option>
            </select>
          </div>
          <small>ページ番号変数：{page} 現在のページ、{total} 総ページ数</small>
          <label class="custom-css-field">カスタム CSS
            <textarea id="customCssInput" rows="4" placeholder="例：h1 { color: #7c3aed; }"></textarea>
          </label>
          <button id="resetStyleBtn" type="button">レイアウトを既定値に戻す</button>
        </section>
      </div>
      <div class="live-document">
        <div id="formatToolbar" class="format-toolbar" role="toolbar" aria-label="Markdown 書式設定">
          <button type="button" data-format="heading1" title="見出し1">H1</button>
          <button type="button" data-format="heading2" title="見出し2">H2</button>
          <button type="button" data-format="bold" title="太字"><b>B</b></button>
          <button type="button" data-format="italic" title="斜体"><i>I</i></button>
          <button type="button" data-format="strike" title="取り消し線"><s>S</s></button>
          <span class="toolbar-separator"></span>
          <button type="button" data-format="quote" title="引用">❯</button>
          <button type="button" data-format="unordered-list" title="箇条書き">• リスト</button>
          <button type="button" data-format="ordered-list" title="番号付きリスト">1. リスト</button>
          <button type="button" data-format="task" title="タスクリスト">☐</button>
          <span class="toolbar-separator"></span>
          <button type="button" data-format="link" title="リンク">リンク</button>
          <button type="button" data-format="image" title="画像">画像</button>
          <button type="button" data-format="inline-code" title="インラインコード">コード</button>
          <button type="button" data-format="code-block" title="コードブロック">コードブロック</button>
          <button type="button" data-format="table" title="表">表</button>
          <button type="button" data-format="mermaid" title="Mermaid 図">図</button>
          <button type="button" data-format="horizontal-rule" title="区切り線">―</button>
        </div>
        <textarea id="markdownEditor" class="markdown-source-buffer" spellcheck="false" disabled aria-hidden="true"></textarea>
        <section class="render-panel" aria-label="ライブプレビュー">
          <iframe id="previewFrame" title="直接編集できる Markdown ページ" sandbox="allow-same-origin"></iframe>
        </section>
        <footer class="editor-footer">
          <label><input id="autoSaveToggle" type="checkbox" checked> 自動保存</label>
          <span>ページ上で直接編集 · <span id="editorStats">0 文字 / 0 行</span></span>
        </footer>
      </div>
    </section>
  </main>

  <section class="batch-drawer" aria-label="一括操作">
    <div class="batch-heading">
      <div>
        <strong>選択した文書を一括処理</strong>
        <small>本文は一件ずつ読み、実行前に差分件数を確認します。</small>
      </div>
      <span id="operationState">準備完了</span>
    </div>
    <label>検索<input id="batchFind" type="text" placeholder="置換する文字列"></label>
    <label>置換<input id="batchReplace" type="text" placeholder="新しい文字列"></label>
    <label class="case-option"><input id="caseSensitive" type="checkbox" checked> 大文字小文字を区別</label>
    <button id="previewReplaceBtn" type="button">置換件数を確認</button>
    <button id="applyReplaceBtn" class="danger" type="button" disabled>バックアップして置換</button>
    <button id="exportSelectedBtn" class="primary" type="button">選択を PDF 出力</button>
  </section>

  <dialog id="batchResultDialog">
    <form method="dialog">
      <header><strong id="batchResultTitle">一括処理結果</strong><button value="close">閉じる</button></header>
      <pre id="batchResultBody"></pre>
    </form>
  </dialog>

  <script src="./vendor/mermaid.min.js"></script>
  <script src="./app.js" type="module"></script>
</body>
</html>
